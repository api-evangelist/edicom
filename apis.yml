aid: edicom

name: Edicom

description: EDICOM is a Spanish B2B data-integration company, operating since 1995 and headquartered in the Parque Tecnológico
  de Paterna, Valencia, that provides cloud EDI, electronic invoicing, VAT/tax reporting and international e-compliance solutions.
  Its EDICOM Global Platform and iPaaS integration platform connect businesses with trading partners and tax authorities via
  AS2, AS4, OFTP2, SFTP, VAN, web services and APIs, with real-time tax reporting coverage in 85+ countries.

