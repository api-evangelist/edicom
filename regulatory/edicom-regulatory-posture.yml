      quote: >-
        Edicom guarantees that the processing of personal data will take place within the European Economic Area
        (EEA), or at the group’s offices to facilitate our clients’ international operations and in the data subject interest.
        No personal health data is transferred to any country outside the European Economic Area.
    note: >-
