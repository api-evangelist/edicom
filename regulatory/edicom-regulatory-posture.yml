  data_retention:
    url: https://policies.edicomgroup.com/privacy/version/EDICOM_privacy_EU_en_3_3.pdf
    section: '3. Retention periods'
    evidence:
    - source: https://policies.edicomgroup.com/privacy/version/EDICOM_privacy_EU_en_3_3.pdf
      http_status: 200
      fetched: '2026-10-18'
      quote: >-
        Client Information necessary to manage the contractual relationship and comply with legal obligations will be
        retained for the duration of the contractual relationship and, once it has ended, for the periods necessary to
        address any potential legal liabilities, which will generally be 5 years, and in the case of tax and accounting
        documentation, up to 6 years, in accordance with applicable regulations.
    - source: https://policies.edicomgroup.com/privacy/version/EDICOM_privacy_EU_en_3_3.pdf
      http_status: 200
      fetched: '2026-10-18'
      quote: >-
        With regard to the processing of data for the provision of trust services, the period for which information relating
        to the services provided must be retained shall be 15 years from the expiry of the certificate or the termination
        of the service provided.
    note: >-
      Concrete retention periods per data category: client data generally 5 years after contract end (tax/accounting
      up to 6), trust-service records 15 years, failed video-identification records 5 years, candidate data up to
      6 months after a selection process.
